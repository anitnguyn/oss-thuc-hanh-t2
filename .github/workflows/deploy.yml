name: Build and Deploy ASP.NET to Somee

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Publish
        run: |
          dotnet restore ./WebAspNetDemo/WebAspNetDemo.csproj
          dotnet publish ./WebAspNetDemo/WebAspNetDemo.csproj -c Release -o ./publish

      - name: FTP Deploy to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /www.oss-thuc-hanh-t2.somee.com/
          exclude: |
            **/.git*
            **/.github/**